server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: briko
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:briko}
    username: ${DB_USERNAME:briko}
    password: ${DB_PASSWORD:briko}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

briko:
  jwt:
    secret: ${JWT_SECRET:briko-dev-jwt-secret-change-me-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.briko: DEBUG
